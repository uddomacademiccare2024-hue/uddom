<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>উদ্যম একাডেমিক কেয়ার</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--sf:#fff;--tx:#18202f;--mu:#6b7385;--red:#d93a3d;--blue:#2c45c8;--ln:#e4e7ee;--ok:#12906a;--wa:#c27a00;--tint:#2c45c80d;--tint2:#2c45c818;--redt:#d93a3d12;--okt:#12906a12;--wat:#c27a0016;--in:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#071a12;--card:#0f2a1f;--sf:#143528;--tx:#e9f6ee;--mu:#9dc2ae;--red:#ff6b6e;--blue:#4fd18b;--ln:#245240;--ok:#3fd69f;--wa:#ffb84d;--tint:#4fd18b12;--tint2:#4fd18b20;--redt:#ff6b6e1c;--okt:#3fd69f1a;--wat:#ffb84d1c;--in:#0b2218}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;color:var(--tx);background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--ln)}
header img{height:36px}
header b{flex:1;font-size:15px;line-height:1.25;min-width:0}
header small{color:var(--mu);display:block;font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;overflow:auto;padding:16px;min-height:0;width:100%;max-width:1160px;margin:0 auto}
nav{display:flex;gap:2px;padding:4px 6px;background:var(--card);border-top:1px solid var(--ln);justify-content:center}
nav button{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:none;padding:6px 2px;border-radius:10px;font:500 11.5px inherit;font-family:inherit;color:var(--mu);cursor:pointer}
nav button .ni{font-size:18px;line-height:1.3;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--blue);font-weight:700}nav button.on .ni{filter:none;opacity:1}
nav button.on:after{content:"";width:18px;height:3px;border-radius:3px;background:var(--blue);margin-top:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:15px;font-weight:700}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.clock{font-size:26px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.15}.date{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.grid>.card{margin:0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.slot{border:1px solid var(--ln);border-left:3px solid var(--blue);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--card)}
.admin .slot{cursor:pointer}.admin .slot:hover{background:var(--tint)}
.slot .t{font-weight:600;color:var(--blue);font-size:12px}.slot .s{font-weight:700;font-size:14px}.slot .p{color:var(--mu);font-size:12px}
.slot.off{border-left-color:var(--red)}.slot.off .s{text-decoration:line-through;color:var(--mu)}.slot.exam{border-left-color:var(--wa)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;color:var(--red);background:var(--redt)}.tag.e{color:var(--wa);background:var(--wat)}.tag.ok{color:var(--ok);background:var(--okt)}
.banner{background:var(--redt);color:var(--red);border:1px solid #d93a3d33;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600}.banner.w{background:var(--wat);color:var(--wa);border-color:#c27a0033}
button.b{border:1px solid var(--blue);border-radius:10px;min-height:38px;padding:7px 16px;font:600 13px inherit;font-family:inherit;background:var(--blue);color:#fff;cursor:pointer;transition:.12s}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) button.b:not(.g):not(.r){color:#071a12}}
button.b:hover{filter:brightness(1.1)}button.b:active{transform:scale(.98)}
button.g{background:var(--card);color:var(--tx)!important;border-color:var(--ln)}button.g:hover{background:var(--tint);filter:none}
button.r{background:var(--card);color:var(--red)!important;border-color:var(--ln)}button.r:hover{background:var(--redt);filter:none}
button.sm{min-height:30px;padding:3px 11px;font-size:12px;border-radius:8px}
button:disabled{opacity:.5}
input,select{font:inherit;font-size:14px;min-height:40px;padding:7px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--in);color:var(--tx);width:100%;min-width:0;outline:none}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--tint2)}
label{font-size:12px;font-weight:600;color:var(--mu);display:block;margin-bottom:3px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.tw{overflow-x:auto}.vs{max-height:360px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:12px}.vs th{position:sticky;top:0;background:var(--card);z-index:1}
tr:hover>td{background:var(--tint)}
.ct th,.ct td,.ctr th,.ctr td{text-align:center;vertical-align:middle}.ctr .slot{text-align:left}
.pt{width:100%}.pt th,.pt td{white-space:normal;border:1px solid #c5cde6;color:#18202f;text-align:center;padding:6px}.pt th{background:#eef2ff;font-weight:700}
.id{font-family:ui-monospace,monospace;font-weight:700;color:var(--blue);font-size:.92em}
#login{margin:auto;max-width:370px;width:100%;text-align:center;padding:20px}#login img{width:210px;max-width:70%}
#login .card{padding:22px;border-radius:18px}#login .card label{margin-top:10px}
.md{position:fixed;inset:0;background:#10142080;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.md>div{background:var(--sf);color:var(--tx);border-radius:18px;padding:20px;max-width:440px;width:100%;max-height:92dvh;overflow:auto}
.slip{border:2px dashed var(--ln);border-radius:14px;padding:14px;text-align:center}.slip img{height:60px}
.scl,.scp2{display:none}.scw.pm .scl,.scw.pm .scp2{display:block!important}.scw.pm{width:170mm;margin:0 auto}.scw.pm .scp2{margin-top:5mm;padding-top:4mm;border-top:1px dashed #888}.scw.pm .scl{text-align:left;font-weight:700;font-size:13px;margin:0 0 2px}.scw.pm .slip{padding:8px 12px;border-width:1px}.scw.pm .slip img{height:44px}.scw.pm .slip h3{margin:2px 0!important}.scw.pm .slip table td{padding:2px 6px}.scw.pm .slip .amt{font-size:20px;margin:4px 0}@media print{.scl{display:block!important;text-align:left;font-weight:700;font-size:13px;margin:0 0 2px}.scp2{display:block!important;margin-top:5mm;padding-top:4mm;border-top:1px dashed #888}.scp{break-inside:avoid;page-break-inside:avoid}.scw{width:170mm;margin:0 auto;break-inside:avoid;page-break-inside:avoid}.scw .slip{padding:8px 12px;border-width:1px}.scw .slip img{height:44px}.scw .slip h3{margin:2px 0!important}.scw .slip table td{padding:2px 6px}.scw .slip .amt{font-size:20px;margin:4px 0}}
.slip table td{white-space:normal}.slip .amt{font-size:26px;font-weight:700;color:var(--red);margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.stat{border-radius:12px;padding:10px 12px;background:var(--card);border:1px solid var(--ln)}.stat small{display:block;color:var(--mu);font-size:12px}.stat b{font-size:19px}
.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--red)}
.sumbox{border:1px solid var(--ln);border-radius:14px;padding:14px;margin:8px 0 12px;background:var(--tint)}.sumbox>small{color:var(--mu);font-weight:600}.sumbox .net{font-size:27px;font-weight:700;margin:2px 0}.sumbox .stats{margin-top:8px}.sumbox .stat{background:var(--card)}td button.lk{background:none;border:0;color:var(--blue);padding:0;min-height:0;font:700 13px inherit;font-family:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.rp{-webkit-print-color-adjust:exact;print-color-adjust:exact}.rp table{width:100%;font-size:12px}.rp th,.rp td{white-space:normal;border:1px solid #c5cde6;color:#18202f;text-align:center;padding:4px 5px}.rp th{background:#eef2ff;font-weight:700}
@media(max-width:520px){main{padding:10px}.card{padding:13px}}
/* লগইন ক্রেডিট ও ওপেনিং অ্যানিমেশন */
.cr{margin:26px 0 8px;text-align:center}.cr:before{content:'';display:block;width:74px;height:3px;margin:0 auto 12px;border-radius:3px;background:linear-gradient(90deg,#0ea5e9,#6366f1,#ec4899)}
.cr span{display:block;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}
.cr b{display:block;margin-top:4px;font-size:21px;letter-spacing:.09em;font-weight:800;background:linear-gradient(90deg,#0ea5e9,#6366f1,#ec4899,#f59e0b,#10b981,#0ea5e9);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:crg 7s linear infinite}
@keyframes crg{to{background-position:300% 0}}
#wlc{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 30% 20%,#2b7bd6 0,#1b4f8a 45%,#0f2a4a 100%);color:#fff;animation:wf .7s ease both}
#wlc .wl{background:#fff;border-radius:24px;padding:14px 22px;box-shadow:0 18px 50px #0006;animation:wz 1.6s cubic-bezier(.2,.8,.2,1) both,wfl 3s ease-in-out 1.6s infinite}
#wlc .wt{font-size:15px;letter-spacing:.35em;opacity:0;animation:wu 1s ease .5s forwards}
#wlc .wn{font-size:24px;font-weight:800;opacity:0;animation:wu 1.1s ease .8s forwards;text-align:center;padding:0 16px}
#wlc .wb{width:170px;height:4px;border-radius:4px;background:#ffffff40;overflow:hidden;margin-top:12px}
#wlc .wb i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#7dd3fc,#fff);animation:wp 1.8s ease-in-out .2s forwards}
#wlc.out{opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s .9s}
#app.opn{animation:opn 1.5s cubic-bezier(.2,.7,.2,1) .6s backwards}
@keyframes wf{from{opacity:0}to{opacity:1}}@keyframes wz{from{opacity:0;transform:scale(.6) translateY(20px)}to{opacity:1;transform:none}}@keyframes wfl{50%{transform:translateY(-6px)}}@keyframes wu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes wp{to{width:100%}}
@keyframes opn{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){#wlc{display:none}#app.opn{animation:none}.cr b{animation:none}}
@media print{#wlc{display:none!important}}
#wm{display:none}@media print{#wm{display:flex!important;position:fixed;left:0;top:0;width:100%;height:100%;align-items:center;justify-content:center;z-index:99999;pointer-events:none;visibility:visible!important}#wm img{width:62%;max-width:560px;opacity:.1;visibility:visible!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media print{:root:root:root{--bg:#fff;--card:#fff;--sf:#fff;--tx:#18202f;--mu:#6b7385;--red:#d93a3d;--blue:#2c45c8;--ln:#c5cde6;--ok:#12906a;--wa:#c27a00;--tint:#fff;--tint2:#fff;--redt:#fff;--okt:#fff;--wat:#fff;--in:#fff}.md>div{max-width:none!important;max-height:none!important;overflow:visible!important;background:#fff!important;color:#18202f!important}body *{visibility:hidden}.md,.md *{visibility:visible}.noprint{display:none!important}html,body{height:auto!important;overflow:visible!important;display:block!important}#app{display:none!important}.md{position:absolute!important;inset:auto!important;left:0;top:0;width:100%;background:none}.md>div{border-radius:0!important;padding:0!important}.rp section{break-inside:avoid}}
:root[data-theme=dark]{--bg:#071a12;--card:#0f2a1f;--sf:#143528;--tx:#e9f6ee;--mu:#9dc2ae;--red:#ff6b6e;--blue:#4fd18b;--ln:#245240;--ok:#3fd69f;--wa:#ffb84d;--tint:#4fd18b12;--tint2:#4fd18b20;--redt:#ff6b6e1c;--okt:#3fd69f1a;--wat:#ffb84d1c;--in:#0b2218}
:root[data-theme=dark] button.b:not(.g):not(.r){color:#071a12}

/* ===== নতুন ডিজাইন: স্মার্ট কোচিং ম্যানেজমেন্ট সিস্টেম ===== */
:root{--bg:#eef1f8;--shadow:0 1px 2px #1b2a5a10,0 6px 18px #1b2a5a0d;--grad:linear-gradient(120deg,#1d3fbd 0,#4338ca 55%,#7c3aed 100%)}
:root[data-theme=dark]{--grad:linear-gradient(120deg,#0c4a32 0,#0f6b48 55%,#12875c 100%)} @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--grad:linear-gradient(120deg,#0c4a32 0,#0f6b48 55%,#12875c 100%)}} :root[data-theme=dark]{--shadow:0 1px 2px #0006,0 8px 24px #0004}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--shadow:0 1px 2px #0006,0 8px 24px #0004}}
body{background:var(--bg)}
header{background:var(--grad);color:#fff;border:0;padding:10px 14px;gap:10px;box-shadow:0 4px 18px #2b2f8a40;position:relative;z-index:5}
header b{color:#fff;font-size:15.5px}header small{color:#ffffffcc}header .id{color:#fff;background:#ffffff26;padding:0 6px;border-radius:6px}
header .lg{background:#fff;border-radius:12px;padding:3px 7px;display:flex;align-items:center;flex-shrink:0}header .lg img{height:30px;display:block}
.hb{background:#ffffff24;border:1px solid #ffffff38;color:#fff;border-radius:11px;width:40px;height:40px;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit}.hb:hover{background:#ffffff3a}
.card{border-radius:16px;box-shadow:var(--shadow);border-color:transparent}
.stat{border-radius:14px;box-shadow:var(--shadow);border-color:transparent}
.sumbox{border-radius:16px;border-color:transparent;background:linear-gradient(135deg,var(--tint2),var(--tint))}
button.b:not(.g):not(.r){background:linear-gradient(135deg,#2c45c8,#5b4bdc);border-color:transparent;box-shadow:0 3px 10px #3b3fc84d}
button.b{border-radius:11px}
:root[data-theme=dark] button.b:not(.g):not(.r){background:linear-gradient(135deg,#4fd18b,#2fc4a0);color:#071a12;box-shadow:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) button.b:not(.g):not(.r){background:linear-gradient(135deg,#4fd18b,#2fc4a0);box-shadow:none}}
h3{letter-spacing:.1px}
th{background:var(--tint);}
.modal-x{}
.md>div{border-radius:20px;box-shadow:0 24px 70px #0006}
/* সাইডবার (ডিফল্টে লুকানো) */
#sbo{position:fixed;inset:0;background:#0b1024a0;backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
aside#sb{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:86vw;background:var(--card);z-index:31;transform:translateX(-105%);transition:transform .27s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;box-shadow:8px 0 40px #0005;padding-bottom:env(safe-area-inset-bottom,0px)}
body.sbo aside#sb{transform:none}body.sbo #sbo{opacity:1;pointer-events:auto}
.sbh{background:var(--grad);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;gap:12px;align-items:center}
.sbh .lg{background:#fff;border-radius:14px;padding:4px 8px;flex-shrink:0}.sbh .lg img{height:34px;display:block}
.sbh b{display:block;font-size:15px;line-height:1.25}.sbh small{display:block;color:#ffffffd0;font-size:12px;margin-top:2px}
.sbm{flex:1;overflow:auto;padding:10px}
.si{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--tx);font:600 14.5px inherit;font-family:inherit;padding:11px 12px;border-radius:12px;cursor:pointer;text-align:left;margin:1px 0}
.si:hover{background:var(--tint)}.si .ni{width:26px;text-align:center;font-size:19px;flex-shrink:0}
.si.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px #3b3fc84d}
.sgh .chev{margin-left:auto;transition:transform .2s;color:var(--mu);font-size:13px}.sg.open>.sgh .chev{transform:rotate(180deg)}
.sgb{display:none;margin:0 0 4px 22px;padding-left:10px;border-left:2px solid var(--ln)}.sg.open>.sgb{display:block}
.sgb .si{font-size:14px;font-weight:500;padding:9px 11px}.sgb .si .ni{font-size:16px;width:22px}
.sbf{padding:12px;border-top:1px solid var(--ln);display:grid;gap:8px}
.sbf button{width:100%;justify-content:center}
.thsw{display:flex;background:var(--tint);border-radius:12px;padding:3px;gap:3px}.thsw button{flex:1;border:0;background:none;color:var(--mu);padding:8px 6px;border-radius:9px;font:600 13px inherit;font-family:inherit;cursor:pointer}.thsw button.on{background:var(--card);color:var(--tx);box-shadow:var(--shadow)}
@media print{aside#sb,#sbo,header .hb{display:none!important}}
@media print{*,*:before,*:after{box-shadow:none!important;text-shadow:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}.md{background:none!important}.md>div,.card,.sumbox,.stat,.slip{box-shadow:none!important}}
@media screen{:root[data-theme=dark] .rp td,:root[data-theme=dark] .pt td,:root[data-theme=dark] .rp small,:root[data-theme=dark] .pt small{color:var(--tx)}:root[data-theme=dark] .rp th,:root[data-theme=dark] .pt th{color:#15261e}}
@media screen and (prefers-color-scheme:dark){:root:not([data-theme=light]) .rp td,:root:not([data-theme=light]) .pt td,:root:not([data-theme=light]) .rp small,:root:not([data-theme=light]) .pt small{color:var(--tx)}:root:not([data-theme=light]) .rp th,:root:not([data-theme=light]) .pt th{color:#15261e}}
.sw{display:inline-flex!important;align-items:center;gap:9px;cursor:pointer;margin:0!important;position:relative;user-select:none;font-size:13px}.sw input{position:absolute;opacity:0;width:0!important;height:0!important;min-height:0!important;margin:0;pointer-events:none}.sw .tg{width:34px;height:19px;border-radius:999px;background:var(--ln,#c5cde6);position:relative;transition:.18s;flex:none}.sw .tg::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:.18s}.sw input:checked+.tg{background:var(--blue,#1f9d6b)}.sw input:checked+.tg::after{left:17px}.sw input:focus-visible+.tg{outline:2px solid var(--blue,#1f9d6b);outline-offset:2px}

/* লগআউট ধন্যবাদ এনিমেশন */
#lo{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;color:#fff;overflow:hidden;background:linear-gradient(135deg,#2c45c8,#12906a,#2c45c8);background-size:300% 300%;animation:loBg 5s ease infinite,loFi .45s ease both}
#lo.out{animation:loBg 5s ease infinite,loFo .5s ease forwards}
#lo .lol{width:108px;height:108px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;animation:loPop .7s cubic-bezier(.3,1.6,.5,1) both,loPulse 1.8s ease-out .7s infinite}
#lo .lol img{max-width:72%;max-height:72%;height:auto!important}
#lo .low{font-size:54px;display:inline-block;transform-origin:70% 70%;animation:loUp .6s ease .3s both,loWave 1.1s ease-in-out .8s 2}
#lo h2{margin:0;font-size:22px;line-height:1.6;max-width:520px;animation:loUp .7s ease .5s both}
#lo .lob{width:150px;height:4px;border-radius:9px;background:#fff4;overflow:hidden;margin-top:8px;animation:loUp .5s ease .9s both}
#lo .lob i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;animation:loBar 2.3s linear forwards}
#lo .sp{position:absolute;bottom:-30px;opacity:0;animation:loSp linear infinite}
@keyframes loBg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes loFi{from{opacity:0}to{opacity:1}}
@keyframes loFo{to{opacity:0;transform:scale(1.04)}}
@keyframes loPop{from{transform:scale(0) rotate(-120deg);opacity:0}to{transform:none;opacity:1}}
@keyframes loPulse{0%{box-shadow:0 0 0 0 #fff9}100%{box-shadow:0 0 0 34px #fff0}}
@keyframes loUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes loWave{0%,100%{transform:rotate(0)}25%{transform:rotate(22deg)}50%{transform:rotate(-14deg)}75%{transform:rotate(18deg)}}
@keyframes loBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes loSp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh) scale(1.2) rotate(40deg);opacity:0}}

/* বাটন সুসজ্জা: বাটনের মাঝের ফাঁকা স্পেস বাদ, সমান ও পরিপাটি গ্যাপ */
button.b{display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;line-height:1.25;vertical-align:middle;text-align:center}
td button.b,.tw button.b{margin:2px 6px 2px 0}
td button.b:last-child,.tw button.b:last-child{margin-right:0}
td[style*="text-align:right"] button.b{margin:2px 0 2px 6px}
td[style*="text-align:right"] button.b:first-child{margin-left:0}
.bar>button.b,.bar>span>button.b,span[style*="display:flex"]>button.b,div[style*="display:flex"]>button.b{margin:0}
.bar{gap:8px}

/* অনুমতি উইন্ডোর ট্যাব বাটন: সমান মাপের, দুই কলামে, ডানে-বামে ফাঁকা নেই */
.pmtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pmtabs>button.b{width:100%;margin:0;min-height:40px;padding:6px 8px;white-space:normal;font-size:12.5px}
/* সারিতে সাজানো বাটন (চিপ) পুরো সারি জুড়ে সমানভাবে ছড়াবে, পাশে ফাঁকা থাকবে না */
div[style*="flex-wrap:wrap"]>button.b{flex:1 1 auto}

.fo-hero{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:linear-gradient(135deg,var(--tint2),var(--tint));border:1px solid var(--ln);margin:8px 0 14px}
.fo-av{width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.fo-hero b{display:block;font-size:15px}.fo-hero small{color:var(--mu)}
.fo-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.fo-chips::-webkit-scrollbar{display:none}
.fo-chip{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 13px;font:600 12.5px inherit;font-family:inherit;cursor:pointer;transition:.12s}
.fo-chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .fo-chip.on{color:#071a12}}
.fo-amt{position:relative}.fo-amt span{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--mu);pointer-events:none}.fo-amt input{padding-left:30px;font-size:18px;font-weight:700;min-height:48px}
.fo-pv{margin:14px 0;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--card)}
.fo-pv>div{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:14px;border-bottom:1px dashed var(--ln)}
.fo-pv>div:last-child{border:0;background:var(--tint2);font-size:15.5px;font-weight:700}
.fo-pv .pl{color:var(--red);font-weight:700}.fo-pv .nm{font-weight:700}
.fo-pv small{color:var(--mu);font-weight:500}
.fo-li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-left:3px solid var(--blue);border-radius:10px;margin-bottom:6px;background:var(--card);font-size:13.5px}
.fo-li>div{flex:1;min-width:0}.fo-li b{display:block}.fo-li small{color:var(--mu)}
.tag.fo{color:var(--blue);background:var(--tint2)}
.fo-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fo-cb{min-height:40px;margin-left:auto;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px var(--tint2)}

/* ===== রেসপনসিভ লেআউট: ডিভাইসের পর্দা অনুযায়ী বাটন/ফর্ম সাজানো ===== */
@media screen{
html,body{height:100dvh}
header,main{padding-left:max(var(--hp,16px),env(safe-area-inset-left,0px));padding-right:max(var(--hp,16px),env(safe-area-inset-right,0px))}
button{max-width:100%}
button.b,.fo-chip{white-space:normal;line-height:1.25;text-align:center}
td button.b,th button.b,.tw button.b{white-space:nowrap}
.bar,.card.bar{flex-wrap:wrap;row-gap:8px}
.bar>span,.bar>div{min-width:0}
main [style*="display:flex"],.md [style*="display:flex"]{flex-wrap:wrap}
.f{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
td[style*="display:flex"]{display:table-cell!important;white-space:nowrap}
td[style*="display:flex"]>button+button{margin-left:6px}
input[type=date],input[type=month],input[type=time]{max-width:100%;min-width:0}
.md>div{overscroll-behavior:contain}
}
/* বড় পর্দা (ডেস্কটপ/ল্যাপটপ) */
@media screen and (min-width:1100px){main{max-width:1280px;padding:20px 24px}.md>div{max-width:520px}.card{padding:18px}}
/* ট্যাবলেট */
@media screen and (min-width:601px) and (max-width:1099px){main{padding:14px 18px}.md>div{max-width:500px}}
/* মোবাইল */
@media screen and (max-width:600px){
:root{--hp:12px}
header{gap:8px;padding-top:6px;padding-bottom:6px}header b{font-size:14px}
.bar>button.b,.bar>.b{flex:1 1 auto}
.bar>span{display:flex;flex-wrap:wrap;gap:6px;width:100%}.bar>span>button{flex:1 1 auto}
.card>.bar>h3,.card>.bar>b{flex:1 1 100%}
.md{padding:8px;align-items:flex-end}
.md>div{max-width:none!important;width:100%;padding:16px 14px;border-radius:18px 18px 14px 14px;max-height:94dvh}
.md .bar{gap:8px}.md .bar>button.b,.md .bar>span>button.b{flex:1 1 calc(50% - 8px)}
.md .bar:has(>button:only-child)>button{flex:1 1 100%}
.md .bar>span{width:auto;flex:1 1 100%}
.tw table,table{font-size:12.5px}th,td{padding:8px 6px}
.fo-row{align-items:stretch}.fo-row .f{max-width:none!important;flex:1 1 100%!important}.fo-cb{width:100%;margin:0;justify-content:center}
.stats{grid-template-columns:repeat(2,1fr)}
.slots{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.clock{font-size:22px}
}
@media screen and (max-width:360px){header b{font-size:13px}.stats{grid-template-columns:1fr}.md .bar>button.b,.md .bar>span>button.b{flex:1 1 100%}}
/* ট্যাচ ডিভাইসে বড় ট্যাপ এরিয়া */
@media screen and (pointer:coarse){button.b{min-height:44px}button.b.sm{min-height:38px;padding:6px 13px}input,select{min-height:44px}.fo-chip{padding:8px 14px}nav button,.si{min-height:44px}}
/* ল্যান্ডস্কেপ ফোন */
@media screen and (max-height:480px) and (orientation:landscape){.md>div{max-height:96dvh}.md{align-items:center}header img{height:28px}}

/* ===== বাটন সুসজ্জা: সারি কখনো ভেঙে নিচে নামবে না; বাটনের মাপ লেখা অনুযায়ী ===== */
.rw{display:flex!important;flex-wrap:nowrap!important;align-items:center!important;justify-content:space-between;gap:8px;width:100%;min-width:0}
.rw>*{flex:0 0 auto!important;width:auto!important;min-width:0}
.rw>h3,.rw>b,.rw>small{flex:1 1 auto!important;min-width:0!important;margin:0!important;overflow-wrap:anywhere}
.rw>span,.rw>.rn{display:flex!important;flex-wrap:nowrap!important;gap:6px;align-items:center}
.rw button.b,.rw>button{flex:0 0 auto!important;width:auto!important;max-width:none!important;white-space:nowrap!important;margin:0!important}
.rw.rr{justify-content:flex-end!important}
.rw.rwt button.b{flex:0 1 auto!important;white-space:normal!important}
.rn input{width:auto!important;flex:0 1 150px;min-width:0!important}
@media(max-width:600px){.rn input{flex:0 1 132px;font-size:12px!important;padding:2px 4px!important}.rn button.b{padding-left:9px!important;padding-right:9px!important}.rw>h3{font-size:15px}.rw button.b.sm,.rw>button,.rw>span button{font-size:12px!important;padding-left:9px!important;padding-right:9px!important}.rw.rwt button.b{font-size:12.5px!important;padding:8px 9px!important}.rw>h3{flex:1 1 0!important}}
.chips.cg{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:6px 0 4px}
.chips.cg>.chip{display:block;width:100%;margin:0!important}
.chips.cg>.chip>span{display:flex;justify-content:center;align-items:center;width:100%;box-sizing:border-box;text-align:center;padding:8px 6px}
.md:has(.cwp){align-items:center!important}
.bar:has(>.cl-r){flex-wrap:nowrap!important}
.bar>.cl-r{flex:0 0 auto!important;width:auto!important;white-space:nowrap!important}
.bar:has(>.cl-r:only-child){justify-content:flex-end!important}

const EXD=['ঘর ভাড়া','বিদ্যুৎ বিল','ওয়াইফাই/ইন্টারনেট বিল','পানির বিল','গ্যাস বিল','স্টেশনারি ও প্রিন্টিং','মেরামত ও রক্ষণাবেক্ষণ','বিজ্ঞাপন ও প্রচার','অন্যান্য'];
function expWin(ym,id){const e=id?EX().find(x=>x.id===id):null;closeM();const t=iso(new Date()),d=e?e.date:(t.slice(0,7)===ym?t:ym+'-01'),names=[...new Set(EXD.concat(EX().map(x=>x.title)))];
 modal(`<h3>${e?'ব্যয় এডিট':'➕ নতুন ব্যয় যোগ'}</h3><label>ব্যয়ের খাত (তালিকা থেকে বাছুন বা নিজে লিখুন)</label><input id="ex1" list="exl" value="${esc(e?e.title:'')}" placeholder="যেমন: ঘর ভাড়া"><datalist id="exl">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="f" style="margin-top:6px"><div><label>টাকা</label><input id="ex2" type="number" min="1" value="${e?e.amt:''}"></div><div><label>তারিখ</label><input id="ex3" type="date" value="${d}"></div></div><label>নোট (ঐচ্ছিক)</label><input id="ex4" value="${esc(e?e.note||'':'')}"><div class="bar" style="margin-top:10px"><button class="b g" onclick="closeM();acctMon('${ym}')">বাতিল</button><button class="b" onclick="expSave('${ym}',${id||0})">সংরক্ষণ</button></div>`)}
function expSave(ym,id){const title=$('#ex1').value.trim(),amt=+$('#ex2').value,date=$('#ex3').value,note=$('#ex4').value.trim();
 if(!title||!(amt>0)||!date){alert('ব্যয়ের খাত, টাকার পরিমাণ ও তারিখ দিন।');return}
 const isNew=!id;
 if(id){const e=EX().find(x=>x.id===id);Object.assign(e,{title,amt,date,note,ym:date.slice(0,7)})}else EX().push({id:Date.now(),title,amt,date,note,ym:date.slice(0,7)});
 save();const ym2=date.slice(0,7);
 if(!isNew){closeM();acctMon(ym2);okPop('ব্যয় আপডেট হয়েছে ✨','<b>'+esc(title)+'</b> খাতের হিসাবটি নিরাপদে আপডেট হয়েছে।',amt);return}
 const mdl=[...document.querySelectorAll('.md')].pop();if(mdl)mdl.remove();acctMon(ym2);
 if(mdl){document.body.appendChild(mdl);['ex1','ex2','ex4'].forEach(k=>{const el=mdl.querySelector('#'+k);if(el)el.value=''});
  mdl.querySelectorAll('button').forEach(b=>{const o=b.getAttribute('onclick')||'';if(o.indexOf('closeM();acctMon(')===0)b.setAttribute('onclick',"closeM();acctMon('"+ym2+"')")});
  try{document.activeElement&&document.activeElement.blur()}catch(e){}}
 okPop('ব্যয় সফলভাবে সংরক্ষিত হয়েছে ✨','<b>'+esc(title)+'</b> খাতের হিসাবটি নিরাপদে যুক্ত হয়েছে।',amt)}
function okPop(t,sub,amt){const o=document.createElement('div');o.className='okp';o.innerHTML='<div class="okp-c"><div class="okp-i"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="40"/><path d="M26 43l11 11 21-23"/></svg></div><h4 class="okp-t">'+t+'</h4>'+(amt?'<div class="okp-a">৳'+bn(amt)+'</div>':'')+'<p class="okp-s">'+sub+'</p><div class="okp-b"><i></i></div></div>';let x=0;const c=()=>{if(x)return;x=1;o.classList.add('out');setTimeout(()=>o.remove(),300)};o.onclick=c;document.body.appendChild(o);setTimeout(c,2500)}
function expDel(id,ym){const e=EX().find(x=>x.id===id);if(!e)return;ask(e.title+' (৳'+bn(e.amt)+') ব্যয়টি ডিলিট করবেন?',()=>{S.exps=EX().filter(x=>x.id!==id);save();acctMon(ym)})}

/* অন্যান্য আয় (পরীক্ষার ফি, বই/শিট বিক্রি, অনুদান ইত্যাদি — এডমিন নিজের ইচ্ছামত খাত লিখতে পারেন) */
const INC=()=>S.incs||(S.incs=[]); const INCD=['পরীক্ষার ফি','মডেল টেস্ট ফি','বই/শিট বিক্রি','ভর্তি ফরম বিক্রি','অনুদান','অন্যান্য'];
function incWin(ym,id){const fm=!!document.querySelector('.md'),e=id?INCV().find(x=>x.id===id):null;closeM();const t=iso(new Date()),d=e?e.date:(t.slice(0,7)===ym?t:ym+'-01'),names=[...new Set(INCD.concat(INCV().map(x=>x.title)))];
 modal(`<h3>${e?'আয় এডিট':'➕ অন্যান্য আয় যোগ'}</h3><label>আয়ের খাত</label><input id="in1" value="${esc(e?e.title:'')}" placeholder="যেমন: মডেল টেস্ট পরীক্ষার ফি"><div class="f" style="margin-top:6px"><div><label>টাকা</label><input id="in2" type="number" min="1" value="${e?e.amt:''}"></div><div><label>তারিখ</label><input id="in3" type="date" value="${d}"></div></div><label>কার কাছ থেকে প্রাপ্ত (স্লিপে থাকবে)</label><input id="in6" value="${esc(e&&e.name!=='—'?e.name:'')}" placeholder="নাম"><label>নোট (ঐচ্ছিক)</label><input id="in4" value="${esc(e?e.note||'':'')}"><small style="color:var(--mu)">সংরক্ষণ করলে পেমেন্ট স্লিপ তৈরি হবে; স্লিপ তৈরি হলেই এটি আয়ে যুক্ত হয়।</small><div class="bar" style="margin-top:10px"><button class="b g" onclick="closeM();${fm?`acctMon('${ym}')`:''}">বাতিল</button><button class="b" onclick="incSave('${ym}',${id||0},${fm?1:0})">সংরক্ষণ</button></div>`)}
function incSave(ym,id,fm){const title=$('#in1').value.trim(),amt=+$('#in2').value,date=$('#in3').value,note=$('#in4').value.trim(),cls='';if(!title||!(amt>0)||!date){alert('আয়ের খাত, টাকার পরিমাণ ও তারিখ দিন।');return}
 const nm=$('#in6').value.trim()||'—';let q;if(id){q=S.pays.find(x=>x.no===id&&x.kind==='অন্যান্য আয়');if(q)Object.assign(q,{title,amt,note,name:nm,di:date,date:new Date(date+'T00:00:00').toLocaleDateString('bn-BD'),mon:mlabel(date.slice(0,7))})}else{q=slipPush({id:'',name:nm,cls},amt,date,title,'অন্যান্য আয়',0,note);q.di=date}
 save();closeM();if(tab==='ac')vAc();if(fm)acctMon(date.slice(0,7));if(!id&&q)slip(q.no)}
function incDel(id,ym){const e=INCV().find(x=>x.id===id);if(!e)return;const fm=!!document.querySelector('.md');ask(e.title+' (৳'+bn(e.amt)+') আয়টি ডিলিট করবেন?',()=>{S.pays=S.pays.filter(x=>!(x.no===id&&x.kind==='অন্যান্য আয়'));save();if(tab==='ac')vAc();if(fm){closeM();acctMon(ym)}})}
/* হিসাবের ব্লক — প্রতিটি তালিকা শুরুতে লুকানো, বাটনে চাপলে দেখা যায় */
function accBlk(k,t,sum,body,add){return `<div class="card acb" style="margin:10px 0;padding:10px"><div class="bar" style="margin:0;gap:8px"><div style="cursor:pointer;min-width:0" onclick="accTg(this.parentNode.querySelector('.accb'))"><b>${t}</b><br><small style="color:var(--mu)">${sum}</small></div><div style="display:flex;gap:6px;align-items:center;flex-shrink:0">${add||''}<button class="b g sm accb" aria-expanded="false" onclick="accTg(this)">▾ লিস্ট দেখুন</button></div></div><div class="accbd" style="display:none;margin-top:8px">${body}</div></div>`}
function accTg(b){const d=b.closest('.acb').querySelector('.accbd'),o=d.style.display==='none';d.style.display=o?'block':'none';b.textContent=o?'▴ লিস্ট লুকান':'▾ লিস্ট দেখুন';b.setAttribute('aria-expanded',o)}
function incTbl(ym){const L=INCV().filter(x=>x.ym===ym),T=L.reduce((a,x)=>a+x.amt,0);return accBlk('inc','➕ অন্যান্য আয় — '+mlabel(ym),'মোট ৳'+bn(T)+' · '+bn(L.length)+'টি আয়',incBody(ym),`<button class="b sm" onclick="incWin('${ym}')">+ আয়</button>`)}
function expTbl(ym){const L=EX().filter(x=>x.ym===ym),T=L.reduce((a,x)=>a+x.amt,0);return accBlk('exp','➖ অন্যান্য ব্যয় — '+mlabel(ym),'মোট ৳'+bn(T)+' · '+bn(L.length)+'টি ব্যয়',expBody(ym),`<button class="b r sm" onclick="expWin('${ym}')">+ ব্যয়</button>`)}
function clsTbl(ym){const b=clsBody(ym);if(!b)return '';const m=mlabel(ym);let f=0,p=0,d=0;S.users.filter(u=>u.cat==='std').forEach(u=>{const s=mstat(u,m);f+=s.f;p+=s.pd;d+=s.due});return accBlk('cls','🏫 শ্রেণী অনুযায়ী ফি আদায় — '+m,`প্রদেয় ৳${bn(f)} · জমা ৳${bn(p)} · বকেয়া ৳${bn(d)}`,b)}
function tchTbl(ym){const b=tchBody(ym);if(!b)return '';let e=0,pd=0,d=0;S.users.filter(u=>isTc(u)).forEach(u=>{const s=tstat(u,ym);if(u.cat!=='tch'&&!s.n&&!s.paid&&!s.due)return;e+=s.earn;pd+=s.paid;d+=s.due});return accBlk('tch','👨‍🏫 শিক্ষকের সম্মানী — '+mlabel(ym),`প্রাপ্য ৳${bn(e)} · প্রদান ৳${bn(pd)} · বকেয়া ৳${bn(d)}`,b)}
function incBody(ym){const L=INCV().filter(x=>x.ym===ym).sort((a,b)=>a.date.localeCompare(b.date)),T=L.reduce((a,x)=>a+x.amt,0);
 return `${L.length?`<div class="tw"><table class="ct" style="width:100%"><tr><th>তারিখ</th><th>খাত</th><th>টাকা</th><th></th></tr>${L.map(x=>`<tr><td>${dfmt(x.date)}</td><td style="white-space:normal">${esc(x.title)}${x.name&&x.name!=='—'?` — ${esc(x.name)}`:''}${x.cls?` <small>(${esc(x.cls)})</small>`:''}${x.note?`<br><small>${esc(x.note)}</small>`:''}</td><td style="color:var(--ok)">৳${bn(x.amt)}</td><td><button class="b g sm" onclick="slip(${x.no})">স্লিপ</button><button class="b sm" onclick="incWin('${ym}',${x.id})">এডিট</button><button class="b r sm" onclick="incDel(${x.id},'${ym}')">ডিলিট</button></td></tr>`).join('')}<tr><td colspan="2"><b>মোট অন্যান্য আয়</b></td><td style="color:var(--ok)"><b>৳${bn(T)}</b></td><td></td></tr></table></div>`:'<small>এই মাসে কোনো অন্যান্য আয় যোগ করা হয়নি।</small>'}<small style="color:var(--mu)">পরীক্ষার ফি, বই/শিট বিক্রি, অনুদান ইত্যাদি যেকোনো আয় এখানে যোগ করুন; উপরের হিসাবে স্বয়ংক্রিয়ভাবে যুক্ত হবে।</small>`}
function expBody(ym){const L=EX().filter(x=>x.ym===ym).sort((a,b)=>a.date.localeCompare(b.date)),T=L.reduce((a,x)=>a+x.amt,0);
 return `${L.length?`<div class="tw"><table class="ct" style="width:100%"><tr><th>তারিখ</th><th>খাত</th><th>টাকা</th><th></th></tr>${L.map(x=>`<tr><td>${dfmt(x.date)}</td><td style="white-space:normal">${esc(x.title)}${x.note?`<br><small>${esc(x.note)}</small>`:''}</td><td style="color:var(--red)">৳${bn(x.amt)}</td><td><button class="b sm" onclick="expWin('${ym}',${x.id})">এডিট</button><button class="b r sm" onclick="expDel(${x.id},'${ym}')">ডিলিট</button></td></tr>`).join('')}<tr><td colspan="2"><b>মোট ব্যয়</b></td><td style="color:var(--red)"><b>৳${bn(T)}</b></td><td></td></tr></table></div>`:'<small>এই মাসে কোনো ব্যয় যোগ করা হয়নি।</small>'}<small style="color:var(--mu)">ঘর ভাড়া, বিদ্যুৎ, ওয়াইফাই ইত্যাদি যেকোনো ব্যয় এখানে যোগ করুন; উপরের হিসাবে স্বয়ংক্রিয়ভাবে বাদ যাবে।</small>`}

/* পরিচালকদের শেয়ার অনুযায়ী লাভ/ক্ষতি বণ্টন (ক্লাস-সম্মানী লাভের হিসাবে আসে না, সেটি শিক্ষক সম্মানী ব্যয়ে আলাদা) */
const shN=u=>Math.max(0,parseFloat(String((u.pf||{}).share||'').replace(/[^\d.]/g,''))||0);
const fmtP=x=>bn(Math.round(x*100)/100);
function shRows(net){const D=S.users.filter(u=>u.cat==='dir'&&shN(u)>0),tot=D.reduce((t,u)=>t+shN(u),0);return{D,tot,rows:D.map(u=>({u,sh:shN(u),amt:Math.round(net*shN(u)/100)}))}}
const b2e=t=>String(t).replace(/[০-৯]/g,c=>'০১২৩৪৫৬৭৮৯'.indexOf(c));
function fundStart(){let y=+ymNow().slice(0,4);S.pays.forEach(p=>{const v=+b2e((p.mon||'').split(' ')[1]);if(v>1990&&v<y)y=v});EX().forEach(x=>{const v=+String(x.ym).slice(0,4);if(v>1990&&v<y)y=v});return y}
function fundCum(end,un){let t=0;for(let y=fundStart();y<=+end.slice(0,4);y++)for(let m=1;m<=12;m++){const ym=y+'-'+String(m).padStart(2,'0');if(ym>end)break;t+=accNums(ym).net}return Math.round(t*un/100)}
function shareTbl(net,end){const{D,tot,rows}=shRows(net),lp=net>=0?'লাভ':'ক্ষতি',un=Math.max(0,100-tot),ua=Math.round(net*un/100),fc=un>0.0001&&end?fundCum(end,un):null,sg=v=>(v<0?'−':'')+'৳'+bn(Math.abs(v));
 return `${D.length?'':'<small style="color:var(--mu)">কোনো পরিচালকের শেয়ার নির্ধারণ করা হয়নি — পুরোটাই কোচিং তহবিলে জমা হচ্ছে। সেটিংস → পরিচালকের প্রোফাইল → এডিটে "কোচিং শেয়ার (%)" দিন।</small>'}<table style="width:100%"><tr><th style="text-align:left">খাত</th><th>শেয়ার</th><th style="text-align:right">${lp}ের ভাগ</th></tr>${rows.map(o=>`<tr><td style="text-align:left">${esc(o.u.name)}<br><small class="id">${o.u.id}</small></td><td>${fmtP(o.sh)}%</td><td style="text-align:right;font-weight:700;color:var(--${o.amt>=0?'ok':'red'})">${sg(o.amt)}</td></tr>`).join('')}${un>0.0001?`<tr style="background:var(--tint)"><td style="text-align:left"><b>🏦 অবণ্টিত / কোচিং তহবিল</b></td><td>${fmtP(un)}%</td><td style="text-align:right;font-weight:700;color:var(--${ua>=0?'ok':'red'})">${sg(ua)}</td></tr>`:''}</table>${fc!==null?`<div style="margin-top:6px;font-size:13px">🏦 কোচিং তহবিলে মোট জমা (শুরু থেকে ${mlabel(end)} পর্যন্ত): <b style="color:var(--${fc>=0?'ok':'red'})">${sg(fc)}</b><br><small style="color:var(--mu)">এই টাকা পরবর্তী মাস/বছরের জন্য কোচিংয়ের ফান্ড হিসেবে থাকবে। বর্তমান শেয়ার অনুযায়ী হিসাব।</small></div>`:''}${tot>100.0001?'<small style="color:var(--red)">সতর্কতা: মোট শেয়ার ১০০% এর বেশি হয়েছে।</small>':''}`}
function shareBlock(net,t,end){return `<div class="card" style="margin:10px 0;padding:10px"><h3 style="margin:0 0 6px">🤝 পরিচালকদের ${t} ${net>=0?'লাভ':'ক্ষতি'} বণ্টন</h3><small style="color:var(--mu);display:block;margin-bottom:6px">নিট ${net>=0?'লাভ':'ক্ষতি'} ৳${bn(Math.abs(net))} শেয়ার অনুযায়ী ভাগ; বাকি অংশ কোচিং তহবিলে যায়। ক্লাস সংখ্যার সম্মানী লাভের হিসাবে ধরা হয় না — সেটি আগেই শিক্ষক সম্মানী ব্যয় হিসেবে বাদ গেছে।</small>${shareTbl(net,end)}</div>`}
/* পরীক্ষা ও ফলাফল */
const EXT=['অধ্যায় ভিত্তিক','বিষয় ভিত্তিক','মডেল টেস্ট','মাসিক পরীক্ষা','সাময়িক পরীক্ষা','চূড়ান্ত পরীক্ষা','অন্যান্য'];let ERC='';
const EXS=()=>S.exams||(S.exams=[]);
const grd=pc=>pc>=80?['A+',5]:pc>=70?['A',4]:pc>=60?['A-',3.5]:pc>=50?['B',3]:pc>=40?['C',2]:pc>=33?['D',1]:['F',0];
const nm2=x=>bn(Math.round(x*100)/100);
function exCalc(e){const R=e.rows.map(r=>{const ab=!!r.ab,m=ab?0:(+r.mk||0),pc=e.full?m/e.full*100:0,g=ab?['—',0]:grd(pc);return Object.assign({},r,{ab,m,pc,ps:!ab&&m>=e.pass,g:g[0],gp:g[1],pos:0})});
 let last=null,pos=0;R.filter(r=>!r.ab).sort((a,b)=>b.m-a.m).forEach((r,i)=>{if(r.m!==last){pos=i+1;last=r.m}r.pos=pos});
 return R.sort((a,b)=>(a.ab-b.ab)||(b.m-a.m)||String(a.sid).localeCompare(String(b.sid),undefined,{numeric:true}))}
